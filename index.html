<style>

:root {
    --negro: #0b0b0b;
    --dorado: #f1a80a;
    --blanco: #ffffff;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--negro);

    font-family: "Montserrat", sans-serif;
}

#cartelera {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;
}

#pantalla {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}

.slide {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    transition:
        opacity 0.8s ease;
}

.slide.activo {
    opacity: 1;
}


/* Fondo desenfocado */

.fondo {
    position: absolute;

    inset: -40px;

    width: calc(100% + 80px) !important;
    height: calc(100% + 80px) !important;

    object-fit: cover !important;

    filter: blur(30px);

    transform: scale(1.1);

    opacity: 0.42;

    z-index: 1;
}


/* Imagen principal */

.imagen {
    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* Oscurecimiento inferior */

.degradado {
    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0) 55%,
            rgba(0,0,0,0.45) 100%
        );
}


/* Marca */

#marca {
    position: fixed;

    z-index: 20;

    left: 28px;
    bottom: 24px;

    padding: 10px 18px;

    background: rgba(11,11,11,0.82);

    border-left: 4px solid var(--dorado);

    color: var(--blanco);

    font-size: 22px;

    font-weight: 800;

    letter-spacing: 2px;

    user-select: none;
}

</style>
